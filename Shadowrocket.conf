# ===== PikPak：网页、登录、API 走 PIKPAK 组；WebDAV 域名直连 =====
# dav.* 系列均实测为腾讯云新加坡（AS132203）：dav.pikpak.ai=43.163.63.134，
# dav.mypikpak.com=43.160.168.77，国内直连可达 17MB/s+；走代理仅几百 KB/s（节点吞吐瓶颈）。
# v3.5：两域名入 PIKPAK fallback 组——直连健康时组状态为 DIRECT（同速）；直连故障 ≤2min 自动切代理
# （慢但能通），消除「完全打不开」体感；恢复自动切回。置于 DOMAIN-SUFFIX 之前防截胡。
# 注意 dav.pikpak.com=192.250.239.171（英国 WHG，疑似遗留端点）保持 PIKPAK 代理不动。
# mypikpak.net：WebDAV 文件下载 302 重定向的动态 CDN（dl-z01a-XXXX.mypikpak.net，SR 日志实证），
# 动态编号无法穷举，必须用后缀规则直连，否则被后缀/泛匹配规则截胡送代理 → 仅几十 KB/s。
# mypikpak.net 保持静态 DIRECT：下载面健康度与 API 面不同步，借组误判风险大于收益，由外脑巡检兜底。
# dav.pikpak.ai / dav.mypikpak.com 已在上方短剧区显式直连（DOMAIN,DIRECT），此处不再重复，避免规则冲突。
DOMAIN-SUFFIX,mypikpak.net,DIRECT
DOMAIN-SUFFIX,pikpak.com,PIKPAK,force-remote-dns
DOMAIN-SUFFIX,mypikpak.com,PIKPAK,force-remote-dns
DOMAIN-SUFFIX,pikpak.ai,PIKPAK,force-remote-dns

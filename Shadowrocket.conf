# 裸 IP 兜底（v3.6）：腾讯云国际 AS132203 一律直连。PikPak 全部基础设施（dav/API/动态下载 CDN）
# 均在腾讯云国际——未来无论出现什么新域名/新 IP，按 IP 直连兜底，从机制上杜绝「截胡进代理」。
# no-resolve：仅对裸 IP 连接生效，域名连接不触发 DNS 解析（零开销、零行为变化）。
# 前提：SR 设置 > GeoLite2 > ASN 库需就位（默认内置库若不含 ASN 数据则此规则不生效）。
IP-ASN,132203,DIRECT,no-resolve
FINAL,PROXY

[Host]
# 不再对 Apple 域名使用系统 DNS：实测运营商标记 DNS 的解析结果导致 ocsp.apple.com 直连秒断、
# 部分 Apple 服务异常（v2/v3 转圈的共同隐患）。现全部走加密 DoH，由国内节点给出正确 CDN 解析。
localhost = 127.0.0.1

# 需要进行 SSL 解密（MITM）的域名，请在 Shadowrocket 内开启“解密”并添加以下域名

[URL Rewrite]
'^https?://(www.)?g.cn' 'https://www.google.com' 302
'^https?://(www.)?google.cn' 'https://www.google.com' 302
# ===== TMDB 图片重写：直连 image.tmdb.org → 走 CF Worker 缓存代理 (shrill-poetry-07fc.2407813427.workers.dev) =====
# 302 重定向：客户端请求 TMDB 海报时自动跳转到 Worker，后续请求直接命中 CF 边缘缓存
'^https?://image\.tmdb\.org/t/p/(.+)$' 'https://shrill-poetry-07fc.2407813427.workers.dev/t/p/$1' 302
'^https?://www\.themoviedb\.org/t/p/(.+)$' 'https://shrill-poetry-07fc.2407813427.workers.dev/t/p/$1' 302
# ===== Rex 数据面重写（2026-11-07 v3.9）：清数据冷启动时模块源码/数据API 走 CF 中继，摆脱直连/PROXY 节点抖动 =====
# api.themoviedb.org → rex-mod-cdn Worker /relay/tmdb/（TMDB 数据 API，api_key 在 query 一并转发）
'^https?://api\.themoviedb\.org/(.+)$' 'https://rex-mod-cdn.2407813427.workers.dev/relay/tmdb/$1' 302
# assets.rexnow.tv（官方模块源码 + regional feed）→ /relay/rexnow/
'^https?://assets\.rexnow\.tv/(.+)$' 'https://rex-mod-cdn.2407813427.workers.dev/relay/rexnow/$1' 302
# testingcf.jsdelivr.net（自有模块源码，CF 前端）→ /relay/jsdcf/
'^https?://testingcf\.jsdelivr\.net/(.+)$' 'https://rex-mod-cdn.2407813427.workers.dev/relay/jsdcf/$1' 302

[Script]
# 保留你原配置的 Apple WLOC 功能；证书私钥不再内嵌于配置文件。
Apple WLOC = type=http-response,pattern=^https?:\/\/(?:gs-loc(?:-cn)?\.apple\.com|gsp-ssl\.ls\.apple\.com|bluedot\.is\.autonavi\.com(?:\.gds\.alibabadns\.com)?)\/clls\/wloc,requires-body=1,binary-body-mode=1,max-size=0,timeout=30,script-path=https://raw.githubusercontent.com/Yu9191/wloc/refs/heads/main/dist/wloc.js,argument=longitude=113.94114&latitude=22.544577&accuracy=25&randomRadius=0&logLevel=info
WLOC Settings = type=http-request,pattern=^https?:\/\/gs-loc(-cn)?\.apple\.com\/wloc-settings\/save,requires-body=0,max-size=0,timeout=10,script-path=https://raw.githubusercontent.com/Yu9191/wloc/refs/heads/main/dist/wloc-settings.js
# SR 端自检（v3.6）：每 10 分钟按真实路由检测 4 条关键链路（代理/dav/TestFlight/PikPak API），
# 失败弹 iOS 通知（同签名 30 分钟去重）、恢复补报；不依赖 Minis 是否打开。
# 前提：SR 设置 > 脚本 URL 页该条目显示 ✅；通知权限授予 SR。
SR 自检 = type=cron,cronexpr=*/10 * * * *,script-path=https://cdn.jsdelivr.net/gh/imABCD01/sr-conf@main/sr-health.js,timeout=60

[MITM]
h2 = false
enable = true
# 继续使用 Shadowrocket 当前本机生成/安装的 CA，不把私钥写进此配置。
hostname = *.google.cn,gs-loc.apple.com,gs-loc-cn.apple.com,bluedot.is.autonavi.com,image.tmdb.org,www.themoviedb.org,*.workers.dev,api.themoviedb.org,assets.rexnow.tv,testingcf.jsdelivr.net,cdn.imabcd.dpdns.org

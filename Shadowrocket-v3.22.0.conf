# ===== v3.11 CF 链路自愈组（2026-11-08）=====
# 背景：v3.10 把 workers.dev / imabcd.dpdns.org 硬改成 DIRECT，结果 Apple TV 一侧
# 模块源 + 海报一起断——根因不是 DIRECT 本身，而是"只留一条路"：直连在该设备网络上
# 被卡死时，连代理这条退路都没有，策略组无从切换。
# 改法：两条路都保留，用 fallback 组让 SR 每 120s 探测，坏的那条自动让位给能用的那条。
# 注意：fallback 成员是"策略/节点"，组健康检查用 url= 的真实业务端点，探到的就是真实链路可用性。
# IMG（海报代理宿主 workers.dev）：国内直连 workers.dev 偶发阻断/DNS 污染 → 代理优先、直连兜底
IMG = select,PROXY // v3.17: 同上
# MOD（模块源 + 数据面中继 + SR 订阅入口 cdn.imabcd.dpdns.org）：代理优先、直连兜底
# 依据 Apple TV 实测：全局代理下 Rex 全秒开 → 节点是这台设备的健康路；直连只做兜底（节点全挂时顶上）
MOD = select,PROXY // v3.17: 同上
SRC = fallback,DIRECT,PROXY,url=https://assets.rexnow.tv/scripts/manifest.json,interval=120,timeout=5
# CNPLAT（国内视频平台/采集站）：直连优先、代理兜底。
# 依据（2026-11-08 域名实测）：
#   ① 国内平台的 DNS 分区域解析——爱奇艺用境外解析器返回 Akamai 美国 IP（23.53.x，直连超时），
#      用境内解析器返回联通北京 IP（110.242.x）。只有"直连"才会走境内 DNS，才拿得到国内 CDN 节点。
#   ② 这类域名此前无显式规则、落到 FINAL,PROXY → 从海外节点访问国内平台 CDN，实测 TTFB 2-4s 或超时。
CNPLAT = fallback,DIRECT,PROXY,url=https://www.bilibili.com/,interval=180,timeout=5
# EMBYPROXY（仅需代理的 2 条 Emby 线路）：代理优先、直连兜底
# 1. lite.cn2gias.uk —— 守候线路
# 2. emby.oceancloud.asia —— 云海官方线路
EMBYPROXY = select,PROXY // v3.17: 同上

# EMBYDIRECT（其余所有 Emby/反代/媒体服务器/反代线路）：直连优先、代理兜底
# 用户确认：除上述 2 条，所有 Emby/反代线路均为国内直连
EMBYDIRECT = fallback,DIRECT,PROXY,url=https://auto.dolby.dpdns.org/emby/,interval=180,timeout=5
# SINK（设备侧日志上报通道 ntfy.sh）：直连优先、代理兜底；两个出口都通才算健康
SINK = fallback,DIRECT,PROXY,url=https://ntfy.sh/v1/health,interval=120,timeout=5


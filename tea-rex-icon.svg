<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="teaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9A86A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8955A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cupGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8D5C0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5E6D3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8D5C0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="highlight" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- 阴影 -->
  <ellipse cx="256" cy="470" rx="140" ry="12" fill="#000000" opacity="0.12"/>
  
  <!-- 杯身 -->
  <path d="M140 160 L110 400 Q110 430 140 450 L372 450 Q402 430 402 400 L372 160 Z" 
        fill="url(#cupGradient)" filter="url(#shadow)" stroke="#D4C4B0" stroke-width="1.5"/>
  
  <!-- 杯内茶汤 -->
  <path d="M150 170 L130 390 Q130 415 155 430 L357 430 Q382 415 382 390 L362 170 Z" 
        fill="url(#teaGradient)" opacity="0.92"/>
  
  <!-- 高光 -->
  <path d="M155 175 L145 350 Q145 370 165 380 L347 380 Q367 370 367 350 L357 175 Z" 
        fill="url(#highlight)" opacity="0.6"/>
  
  <!-- 杯把手 -->
  <path d="M372 180 Q430 180 430 260 Q430 340 372 340" 
        stroke="url(#cupGradient)" stroke-width="18" fill="none" 
        stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M372 185 Q420 185 420 260 Q420 335 372 335" 
        stroke="#F5E6D3" stroke-width="10" fill="none" stroke-linecap="round"/>
  
  <!-- 杯口边缘 -->
  <path d="M110 160 L140 160 L150 170 L110 160" fill="none" stroke="#D4C4B0" stroke-width="2"/>
  <path d="M372 160 L402 160 L392 170 L372 160" fill="none" stroke="#D4C4B0" stroke-width="2"/>
  <path d="M140 160 L372 160" fill="none" stroke="#E8D5C0" stroke-width="3"/>
  
  <!-- 底部阴影/倒影 -->
  <ellipse cx="256" cy="455" rx="130" ry="8" fill="#B8A890" opacity="0.15"/>
  
  <!-- REX 文字 -->
  <text x="256" y="285" 
        font-family="Georgia, serif" 
        font-size="72" 
        font-weight="bold" 
        fill="#8B6B3A" 
        text-anchor="middle" 
        letter-spacing="8px"
        filter="url(#shadow)">REX</text>
  
  <!-- 装饰线 -->
  <path d="M180 310 Q256 300 332 310" 
        stroke="#C9A86A" stroke-width="2" fill="none" stroke-dasharray="8,4" opacity="0.6"/>
  
  <!-- 蒸汽动画 -->
  <g opacity="0.7">
    <path d="M230 140 Q240 100 250 80 Q260 100 270 140" 
          fill="none" stroke="#E8E0D8" stroke-width="3" stroke-linecap="round" 
          stroke-linejoin="round" opacity="0.5">
      <animate attributeName="d" 
               values="M230 140 Q240 100 250 80 Q260 100 270 140; 
                       M230 140 Q235 90 250 70 Q265 90 270 140; 
                       M230 140 Q240 100 250 80 Q260 100 270 140"
               dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M282 140 Q292 100 302 80 Q312 100 322 140" 
          fill="none" stroke="#E8E0D8" stroke-width="2.5" stroke-linecap="round" 
          stroke-linejoin="round" opacity="0.4">
      <animate attributeName="d" 
               values="M282 140 Q292 100 302 80 Q312 100 322 140; 
                       M282 140 Q287 90 302 65 Q317 90 322 140; 
                       M282 140 Q292 100 302 80 Q312 100 322 140"
               dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    </path>
  </g>
  
  <!-- 底部品牌标识 -->
  <text x="256" y="490" 
        font-family="Georgia, serif" 
        font-size="11" 
        fill="#B8A890" 
        text-anchor="middle" 
        letter-spacing="2px"
        opacity="0.6">Tea's Modules for Rex</text>
</svg>